name: CI

on:
  push:
    branches:
      - main
      - develop/core
  pull_request:
    branches:
      - main
      - develop/core

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build container image
        run: docker build -t tasks-ops-tool:ci .
